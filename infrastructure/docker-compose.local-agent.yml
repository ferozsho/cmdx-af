# AgentForge — Local Execution Daemons (Docker), one agent PER project
# ---------------------------------------------------------------------------
# Each project gets its OWN isolated local agent: its own container, its own
# device (id + token), its own workspace registry and its own project mount.
# A project's agent can only see and operate on that project's folder.
#
# All agents connect OUTBOUND to the AgentForge cloud API over WebSocket, so
# they work from any machine — no inbound ports, no public IP, no NAT config.
#
# For a public deployment, each client adds one service per project:
#
#   local-agent-<project>:
#     <<: *local-agent
#     container_name: agentforge-local-<project>
#     environment:
#       <<: *agent-env
#       DEVICE_ID: ${AGENTFORGE_DEVICE_ID_<PROJECT>:?set in .env}
#       DEVICE_TOKEN: ${AGENTFORGE_DEVICE_TOKEN_<PROJECT>:?set in .env}
#       AGENTFORGE_WORKSPACES: ws-<project>=/path/in/container
#     volumes:
#       - /client/absolute/path:/path/in/container
#       - agentforge_config_<project>:/home/agentforge/.agentforge
#
# Pairing: generate a code on the Devices page, then pair inside the agent:
#   docker exec -it agentforge-local-<project> agentforge connect AGF-XXXX
# ---------------------------------------------------------------------------

x-local-agent: &local-agent
  build:
    context: ..
    dockerfile: apps/local-agent/Dockerfile
  image: agentforge-local:latest
  restart: unless-stopped
  init: true
  read_only: true
  # Operate directly on the mounted host project folder (owned by the host
  # user), so run as root and keep the capabilities needed for file access and
  # tool subprocesses (git/npm/pip). Base filesystem stays read-only.
  user: "0:0"
  cap_drop: ["ALL"]
  cap_add:
    - CAP_DAC_OVERRIDE
    - CAP_DAC_READ_SEARCH
    - CAP_FOWNER
    - CAP_CHOWN
    - CAP_SETUID
    - CAP_SETGID
    - CAP_KILL
  security_opt: ["no-new-privileges:true"]
  environment: &agent-env
    # Keep the CLI's config dir on the mounted volume (Path.home() would
    # otherwise point at /root).
    HOME: /home/agentforge
    # Git global config lives on the config volume (base fs is read-only);
    # repos are marked safe.directory by the entrypoint.
    GIT_CONFIG_GLOBAL: /home/agentforge/.agentforge/gitconfig
    # Public server base URL (clients point this at the hosted AgentForge API).
    # Unset => local dev stack.
    AGENTFORGE_SERVER_URL: ${AGENTFORGE_SERVER_URL:-http://api:8000}
    CLOUD_WSS_URL: ws://api:8000/api/v1/ws/devices
    CLOUD_API_URL: http://api:8000/api/v1
    QDRANT_URL: http://qdrant:6333
  tmpfs:
    - /tmp:size=512m,mode=1777
  networks:
    - default

services:
  # ── Local agent for the "Test Project" (cmdx-af repo) ─────────────────────
  local-agent-cmdx-af:
    <<: *local-agent
    container_name: agentforge-local-cmdx-af
    environment:
      <<: *agent-env
      DEVICE_ID: ${AGENTFORGE_DEVICE_ID_CMDXAF:?AGENTFORGE_DEVICE_ID_CMDXAF must be set in .env}
      DEVICE_TOKEN: ${AGENTFORGE_DEVICE_TOKEN_CMDXAF:?AGENTFORGE_DEVICE_TOKEN_CMDXAF must be set in .env}
      # Human-readable name shown on the Devices page.
      AGENTFORGE_DEVICE_NAME: ${AGENTFORGE_DEVICE_NAME_CMDXAF:-Test Project (cmdx-af)}
      # This agent only ever sees the cmdx-af project.
      AGENTFORGE_WORKSPACES: ${AGENTFORGE_WORKSPACES_CMDXAF:-ws-test=/home/administrator/cmdx-af}
    volumes:
      - ${PROJECT_CMDXAF:-/home/administrator/cmdx-af}:${PROJECT_CMDXAF:-/home/administrator/cmdx-af}
      - agentforge_config_cmdxaf:/home/agentforge/.agentforge
      - hf_cache:/home/agentforge/.cache/huggingface

  # ── Local agent for the "GLSM" project (Moodle repo) ──────────────────────
  local-agent-glsm:
    <<: *local-agent
    container_name: agentforge-local-glsm
    environment:
      <<: *agent-env
      DEVICE_ID: ${AGENTFORGE_DEVICE_ID_GLSM:?AGENTFORGE_DEVICE_ID_GLSM must be set in .env}
      DEVICE_TOKEN: ${AGENTFORGE_DEVICE_TOKEN_GLSM:?AGENTFORGE_DEVICE_TOKEN_GLSM must be set in .env}
      # Human-readable name shown on the Devices page.
      AGENTFORGE_DEVICE_NAME: ${AGENTFORGE_DEVICE_NAME_GLSM:-GLSM (Moodle)}
      # This agent only ever sees the glsm project.
      AGENTFORGE_WORKSPACES: ${AGENTFORGE_WORKSPACES_GLSM:-ws-glsm=/home/administrator/glsm}
    volumes:
      - ${PROJECT_GLSM:-/home/administrator/glsm}:${PROJECT_GLSM:-/home/administrator/glsm}
      - agentforge_config_glsm:/home/agentforge/.agentforge
      - hf_cache:/home/agentforge/.cache/huggingface

networks:
  default:
    name: infrastructure_default
    external: true

volumes:
  agentforge_config_cmdxaf:
  agentforge_config_glsm:
  hf_cache:

# AgentForge — Local Execution Daemon (Docker)
# ---------------------------------------------------------------------------
# Runs the local agent inside a container. It connects OUTBOUND to the AgentForge
# cloud API over WebSocket, so it works from any machine — no inbound ports,
# no public IP, no NAT configuration.
#
# THIS FILE is the dev template for this machine. The same image works for any
# client anywhere in the world; they just run it with their own config:
#
#   docker run -d --name agentforge-local \
#     -e AGENTFORGE_SERVER_URL=https://your-agentforge.example.com \
#     -e AGENTFORGE_DEVICE_ID=... -e AGENTFORGE_DEVICE_TOKEN=... \
#     -e 'AGENTFORGE_WORKSPACES=ws-proj=/app/my-project,ws-web=/app/my-web' \
#     -v /absolute/path/to/my-project:/app/my-project \
#     -v /absolute/path/to/my-web:/app/my-web \
#     -v agentforge_config:/home/agentforge/.agentforge \
#     agentforge-local:latest
#
# Pairing: generate a code on the Devices page, then either set the device id/
# token above, or run inside the container:
#   docker exec -it agentforge-local agentforge connect AGF-XXXX
# ---------------------------------------------------------------------------

services:
  local-agent:
    build:
      context: ..
      dockerfile: apps/local-agent/Dockerfile
    image: agentforge-local:latest
    container_name: agentforge-local
    restart: unless-stopped
    init: true
    read_only: true
    # The local agent must operate directly on host project folders (which are
    # owned by the host user, uid 1000), so it runs as root and keeps the
    # capabilities needed to read/write those bind mounts and run tool
    # subprocesses (git/npm/pip). The base image filesystem stays read-only.
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add:
      - CAP_DAC_OVERRIDE
      - CAP_DAC_READ_SEARCH
      - CAP_FOWNER
      - CAP_CHOWN
      - CAP_SETUID
      - CAP_SETGID
      - CAP_KILL
    security_opt: ["no-new-privileges:true"]
    environment:
      # Keep the CLI's config dir on the mounted volume even though we run as
      # root (otherwise Path.home() would point at /root).
      - HOME=/home/agentforge
      # Git global config lives on the writable config volume (base fs is
      # read-only). Repos owned by the host user are marked safe.directory so
      # git doesn't reject them ("dubious ownership").
      - GIT_CONFIG_GLOBAL=/home/agentforge/.agentforge/gitconfig
      # Public server base URL (clients point this at the hosted AgentForge
      # API). Unset => local dev stack.
      - AGENTFORGE_SERVER_URL=${AGENTFORGE_SERVER_URL:-http://api:8000}
      - CLOUD_WSS_URL=ws://api:8000/api/v1/ws/devices
      - CLOUD_API_URL=http://api:8000/api/v1
      - QDRANT_URL=http://qdrant:6333
      - DEVICE_ID=${AGENTFORGE_DEVICE_ID:?AGENTFORGE_DEVICE_ID must be set in .env}
      - DEVICE_TOKEN=${AGENTFORGE_DEVICE_TOKEN:?AGENTFORGE_DEVICE_TOKEN must be set in .env}
      # Workspaces auto-registered at container start (before the daemon
      # boots, so no manual workspace-add + restart needed).
      - AGENTFORGE_WORKSPACES=${AGENTFORGE_WORKSPACES:-ws-test=/home/administrator/cmdx-af,ws-glsm=/home/administrator/glsm}
    volumes:
      # Client project folders, mounted at their absolute paths so the agent
      # works on the actual project files (matches projects.local_path). On a
      # client machine, mount that client's own folders instead.
      - ${PROJECT_CMDXAF:-/home/administrator/cmdx-af}:${PROJECT_CMDXAF:-/home/administrator/cmdx-af}
      - ${PROJECT_GLSM:-/home/administrator/glsm}:${PROJECT_GLSM:-/home/administrator/glsm}
      # Default workspace mount for ad-hoc / other projects.
      - ${AGENT_WORKSPACE:-./workspace}:/workspace
      # Persist pairing credentials + workspace registry across restarts.
      - agentforge_config:/home/agentforge/.agentforge
      # Persist the sentence-transformers model cache (avoids re-downloads).
      - hf_cache:/home/agentforge/.cache/huggingface
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - default

networks:
  default:
    name: infrastructure_default
    external: true

volumes:
  agentforge_config:
  hf_cache:

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-local"
version = "0.1.0"
description = "AgentForge Local Workstation Execution Daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=14.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.42",
    # Server is pinned to Qdrant 1.9; keep the SDK within the guaranteed
    # compatibility window until the persisted cluster is upgraded in order.
    "qdrant-client>=1.9.0,<1.10.0",
    "sentence-transformers>=2.5.0",
    "agentforge-protocol",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.8",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
agentforge = "agentforge_local.cli:main"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-protocol"
version = "0.1.0"
description = "Shared JSON Message Protocol for AgentForge Cloud & Local Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]

[tool.ruff]
line-length = 99
target-version = "py311"
